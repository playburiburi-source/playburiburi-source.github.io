<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>playburiburi</title>
<style>
  :root {
    --paper: #f4ecd8;
    --ink: #3a332c;
    --ink-soft: #7a6f60;
    --line: #d8ccb4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 20px;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    line-height: 1.7;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-soft); margin: 0 0 40px; font-size: 0.95rem; }
  .card {
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
    background: rgba(255,255,255,0.35);
  }
  .card h2 { font-size: 1.15rem; margin: 0 0 6px; }
  .card p { margin: 0 0 14px; color: var(--ink-soft); font-size: 0.95rem; }
  a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  a:hover { color: #000; }
  footer { color: var(--ink-soft); font-size: 0.85rem; margin-top: 40px; }
</style>
</head>
<body>
<main>
  <h1>playburiburi</h1>
  <p class="sub">Indie game development</p>

  <div class="card">
    <h2>Number Smash</h2>
    <p>화면의 블럭을 1부터 순서대로 최대한 빨리 파괴하는 속도 경쟁 게임.<br>
       A speed game: smash the blocks in order, from 1 to 50, as fast as you can.</p>
    <p><a href="privacy.html">개인정보처리방침 / Privacy Policy</a></p>
  </div>

  <footer>
    문의 / Contact: <a href="mailto:playburiburi@gmail.com">playburiburi@gmail.com</a>
  </footer>
</main>
</body>
</html>
